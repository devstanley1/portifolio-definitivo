<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="assets/icons/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
  <link rel="shortcut icon" href="assets/icons/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Stanley Falcão" />
  <link rel="manifest" href="site.webmanifest" />
  <title>Detalhes do Projeto - Stanley Falcão</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    .project-detail {
      padding: 135px 24px 80px;
      min-height: 100vh;
      background: var(--bg-primary);
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 600;
      font-size: 13.5px;
      margin-bottom: 32px;
      padding: 8px 18px;
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      border-radius: 30px;
      transition: var(--transition);
    }
    .back-btn:hover {
      color: #fff;
      border-color: var(--forest-accent);
      transform: translateX(-4px);
    }
    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 400px;
      gap: 40px;
      align-items: start;
    }
    .detail-img-wrap {
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-lg);
      background: var(--surface);
    }
    .detail-img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
      object-position: top;
    }
    .detail-info {
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 30px;
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      gap: 22px;
    }
    .detail-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2.1rem;
      font-weight: 800;
      margin-bottom: 12px;
      color: #ffffff;
      letter-spacing: -0.02em;
    }
    .detail-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .detail-desc {
      color: var(--text-muted);
      font-size: 14.5px;
      line-height: 1.8;
    }
    .detail-desc strong {
      color: #ffffff;
    }
    .detail-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 10px;
      padding-top: 20px;
      border-top: 1px solid var(--border-subtle);
    }
    
    @media (max-width: 968px) {
      .detail-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <nav class="navbar scrolled" id="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">SF<span class="dot">.</span></a>
      <ul class="nav-links">
        <li><a href="index.html#projects">Voltar aos Projetos</a></li>
      </ul>
      <a href="index.html#contact" class="nav-cta">Contato</a>
    </div>
  </nav>

  <main class="project-detail container" id="projectDetail">
    <div style="text-align:center; padding:100px; color: var(--text-muted);">Carregando detalhes do projeto...</div>
  </main>

  <script src="assets/js/project-data.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const projectId = urlParams.get('id');
      
      const project = typeof projectsData !== 'undefined' ? projectsData.find(p => p.id === projectId) : null;
      const container = document.getElementById('projectDetail');
      
      if (!project) {
        container.innerHTML = `
          <a href="index.html#projects" class="back-btn">← Voltar para os Projetos</a>
          <h1 style="color:#fff; margin-top:20px;">Projeto não encontrado.</h1>
        `;
        return;
      }
      
      document.title = project.title + ' - Stanley Falcão';
      
      const tagsHtml = project.tags.map(tag => '<span class="tag">' + tag + '</span>').join('');
      
      let actionsHtml = '';
      if (project.url_live) {
        actionsHtml += '<a href="' + project.url_live + '" target="_blank" rel="noopener noreferrer" class="btn btn-primary w-full">Visualizar ao Vivo ↗</a>';
      }
      if (project.url_github) {
        actionsHtml += '<a href="' + project.url_github + '" target="_blank" rel="noopener noreferrer" class="btn btn-outline w-full"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:8px"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg> Código no GitHub</a>';
      }
      
      container.innerHTML = `
        <a href="index.html#projects" class="back-btn">← Voltar para todos os projetos</a>
        
        <div class="detail-grid">
          <div class="detail-img-wrap">
            <img src="${project.img}" alt="${project.title}" class="detail-img" />
          </div>
          
          <div class="detail-info">
            <div>
              <h1 class="detail-title">${project.title}</h1>
              <div class="detail-tags">${tagsHtml}</div>
            </div>
            
            <div>
              <h3 style="font-size: 12.5px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--forest-light); margin-bottom: 12px; font-weight:700;">Sobre o Projeto</h3>
              <div class="detail-desc">${project.desc}</div>
            </div>
            
            <div class="detail-actions">
              ${actionsHtml}
            </div>
          </div>
        </div>
      `;
    });
  </script>
</body>
</html>
