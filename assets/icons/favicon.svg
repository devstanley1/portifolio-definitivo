<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Fundo Preto Carvão com nuance verde floresta sutil -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141816"/>
      <stop offset="100%" stop-color="#0d110f"/>
    </linearGradient>

    <!-- Borda sutil verde floresta -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e7d57" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#123524" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Letras SF em branco puro fosco -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Ponto Carmesim com brilho -->
    <radialGradient id="crimsonDot" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="70%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </radialGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#dc2626" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base Arredondada Minimalista -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" ry="106" fill="none" stroke="url(#borderGrad)" stroke-width="10"/>

  <!-- Tipografia SF -->
  <text x="235" y="325" text-anchor="middle" font-family="'Space Grotesk', 'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="250" letter-spacing="-6" fill="url(#textGrad)">SF</text>

  <!-- Ponto Carmesim Focal (Harmonizado com SF.) -->
  <circle cx="410" cy="316" r="30" fill="url(#crimsonDot)" filter="url(#glow)"/>
</svg>
